<!DOCTYPE html>
<html lang="ru">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Block Blast Fever</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#14112a;--panel:#1f1b3d;--ink:#f4f1ff;--mute:#9a93c4;--gold:#ffd23f}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;touch-action:none;
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 background:var(--bg);color:var(--ink);font-family:'Fredoka',ui-rounded,system-ui,sans-serif}
.app{height:var(--tg-viewport-stable-height,100dvh);max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px;
 padding:calc(env(safe-area-inset-top,0px) + 6px) 10px calc(env(safe-area-inset-bottom,0px) + 8px);
 background:radial-gradient(120% 70% at 50% 0%,#2a2358 0%,var(--bg) 60%)}
.hud{display:flex;align-items:center;gap:12px}
.who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.avatar{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;background:linear-gradient(135deg,#ff6fc8,#9a6bff)}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{text-align:right;line-height:1.05}
.stat small{display:block;color:var(--mute);font-size:11px}
.stat b{font-size:21px;font-variant-numeric:tabular-nums;display:inline-block}
.stat b.bump{animation:bump .25s ease-out}
@keyframes bump{40%{transform:scale(1.25);color:var(--gold)}}
.icon-btn{width:38px;height:38px;border-radius:12px;border:0;font-size:18px;background:var(--panel);color:var(--ink)}
.meter{position:relative;height:24px;border-radius:12px;overflow:hidden;background:var(--panel)}
.meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#7a4dff,#ff6fc8);transition:width .3s}
.meter.on .fill{background:linear-gradient(90deg,#ff6a2e,var(--gold))}
.meter.on{animation:pulse .8s ease-in-out infinite alternate}
.meter span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5)}
@keyframes pulse{from{box-shadow:0 0 10px rgba(255,157,46,.5)}to{box-shadow:0 0 22px rgba(255,157,46,.95)}}
.stage{position:relative;flex:1;min-height:0;display:flex}
.canvas-wrap{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start}
canvas{display:block;touch-action:none}
.hint{height:18px;text-align:center;font-size:13px;color:var(--gold)}
.boosters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.booster{position:relative;border:2px solid transparent;border-radius:14px;padding:8px 4px 13px;background:var(--panel);color:var(--mute);font:inherit;
 display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.55;transition:transform .1s,opacity .2s}
.booster.ready{opacity:1;color:var(--ink)}
.booster.ready:active{transform:scale(.95)}
.booster.armed{opacity:1;border-color:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.5)}
.booster .ico{font-size:22px;line-height:1}
.booster .lbl{font-size:12px;font-weight:600}
.booster .bar{position:absolute;left:10px;right:10px;bottom:5px;height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.booster .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2fd0c8,#7bdc5f);transition:width .3s}
.overlay{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;
 background:rgba(20,17,42,.88);backdrop-filter:blur(4px);border-radius:16px;animation:in .3s ease-out}
.overlay.show{display:flex}
.overlay h2{margin:0;font-size:28px}
.overlay p{margin:0;color:var(--mute)}
.overlay .big{font-size:58px;font-weight:700;color:var(--gold);line-height:1.1}
.play{margin-top:14px;padding:12px 28px;border:0;border-radius:14px;font:inherit;font-size:18px;font-weight:700;color:#1a1030;background:linear-gradient(135deg,var(--gold),#ff9d2e)}
@keyframes in{from{opacity:0;transform:scale(.96)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="hud">
    <div class="who"><span class="avatar" id="avatar">И</span><span class="name" id="uname">Игрок</span></div>
    <div class="stat"><small>Счёт</small><b id="score">0</b></div>
    <div class="stat"><small>Рекорд</small><b id="best">0</b></div>
    <button class="icon-btn" id="mute" aria-label="Звук">🔊</button>
  </header>
  <div class="meter" id="meter"><div class="fill" id="fill"></div><span id="meterTxt"></span></div>
  <main class="stage">
    <div class="canvas-wrap" id="wrap"><canvas id="cv"></canvas></div>
    <div class="overlay" id="over">
      <h2>Игра окончена</h2><p class="big" id="oScore">0</p><p id="oBest"></p>
      <button class="play" id="again">Играть снова</button>
    </div>
  </main>
  <div class="hint" id="hint"></div>
  <footer class="boosters">
    <button class="booster" data-b="rotate"><span class="ico">🔄</span><span class="lbl">Поворот</span><span class="bar"><i></i></span></button>
    <button class="booster" data-b="refresh"><span class="ico">🎲</span><span class="lbl">Новая тройка</span><span class="bar"><i></i></span></button>
    <button class="booster" data-b="hammer"><span class="ico">🔨</span><span class="lbl">Молоток</span><span class="bar"><i></i></span></button>
  </footer>
</div>

<script>
'use strict';
/* ================= Telegram ================= */
const TG = window.Telegram && window.Telegram.WebApp;
const tgTry = (f) => { try { f(); } catch (e) {} };
if (TG) {
  tgTry(() => TG.ready());
  tgTry(() => TG.expand());
  tgTry(() => { if (typeof TG.disableVerticalSwipes === 'function') TG.disableVerticalSwipes(); });
  tgTry(() => { TG.setHeaderColor('#14112a'); TG.setBackgroundColor('#14112a'); });
}
const userName = () => (TG && TG.initDataUnsafe && TG.initDataUnsafe.user && TG.initDataUnsafe.user.first_name) || 'Игрок';
const haptic = {
  light: () => tgTry(() => TG.HapticFeedback.impactOccurred('light')),
  heavy: () => tgTry(() => TG.HapticFeedback.impactOccurred('heavy')),
  error: () => tgTry(() => TG.HapticFeedback.notificationOccurred('error')),
};
const BEST_KEY = 'bb_best';
const localBest = () => { try { return Number(localStorage.getItem(BEST_KEY)) || 0; } catch (e) { return 0; } };
const saveLocal = (n) => tgTry(() => localStorage.setItem(BEST_KEY, String(n)));
const cloudOk = () => { try { return TG && TG.isVersionAtLeast('6.9') && !!TG.initData && !!TG.CloudStorage; } catch (e) { return false; } };
const loadBest = () => new Promise((res) => {
  const l = localBest();
  if (!cloudOk()) return res(l);
  const t = setTimeout(() => res(l), 2000);
  try { TG.CloudStorage.getItem(BEST_KEY, (err, v) => { clearTimeout(t); res(Math.max(l, err ? 0 : Number(v) || 0)); }); }
  catch (e) { clearTimeout(t); res(l); }
});
const saveBest = (n) => { saveLocal(n); if (cloudOk()) tgTry(() => TG.CloudStorage.setItem(BEST_KEY, String(n))); };

/* ================= Звук (Web Audio) ================= */
let actx = null, muted = false;
try { muted = localStorage.getItem('bb_mute') === '1'; } catch (e) {}
const ac = () => {
  if (!actx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; actx = new C(); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
};
const tone = (f, d, type = 'sine', v = 0.12, to = f, at = 0) => {
  if (muted) return; const c = ac(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, to), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + 0.02);
};
const noise = (d, v, f0, f1) => {
  if (muted) return; const c = ac(); if (!c) return;
  const len = Math.floor(c.sampleRate * d), buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf;
  const fl = c.createBiquadFilter(); fl.type = 'lowpass';
  fl.frequency.setValueAtTime(f0, c.currentTime); fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), c.currentTime + d);
  const g = c.createGain(); g.gain.setValueAtTime(v, c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + d);
  src.connect(fl).connect(g).connect(c.destination); src.start();
};
const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
const sfx = {
  pick: () => tone(520, 0.07, 'triangle', 0.08, 720),
  place: () => { tone(220, 0.12, 'square', 0.06, 120); tone(440, 0.06, 'triangle', 0.05); },
  clear: (n) => { for (let i = 0; i < Math.min(n + 3, 8); i++) tone(440 * Math.pow(2, PENTA[i] / 12), 0.18, 'triangle', 0.09, undefined, i * 0.06); noise(0.25, 0.12, 5000, 500); },
  bomb: () => { noise(0.6, 0.35, 1400, 80); tone(90, 0.5, 'sawtooth', 0.2, 30); },
  bolt: () => { tone(1200, 0.25, 'sawtooth', 0.1, 100); noise(0.2, 0.15, 6000, 800); },
  ice: () => { tone(1400, 0.15, 'triangle', 0.08, 900); tone(2100, 0.1, 'sine', 0.05, 1500, 0.05); },
  hammer: () => { noise(0.1, 0.3, 900, 200); tone(160, 0.12, 'square', 0.12, 60); },
  boost: () => { tone(600, 0.1, 'triangle', 0.1, 1000); tone(900, 0.12, 'triangle', 0.08, 1400, 0.08); },
  fever: () => [0, 4, 7, 12].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.25, 'square', 0.07, undefined, i * 0.08)),
  over: () => [0, -3, -7].forEach((s, i) => tone(300 * Math.pow(2, s / 12), 0.4, 'sawtooth', 0.09, 200 * Math.pow(2, s / 12), i * 0.22)),
};

/* ================= Логика игры ================= */
const N = 6;
const COLORS = ['#ff5d73', '#ffb020', '#7bdc5f', '#2fd0c8', '#4aa3ff', '#9a6bff', '#ff6fc8'];
const COST = { rotate: 120, refresh: 300, hammer: 220 };
const rnd = (n) => Math.floor(Math.random() * n);
const parse = (s) => { const o = []; s.split('/').forEach((row, r) => [...row].forEach((ch, c) => { if (ch === '#') o.push([r, c]); })); return o; };
const SHAPES = ['#','##','#/#','###','#/#/#','####','#/#/#/#','#####','#/#/#/#/#','##/##','###/###/###','##/##/##','###/###',
  '#./#./##','.#/.#/##','##/#./#.','##/.#/.#','###/#../#..','###/..#/..#','#../#../###','..#/..#/###',
  '##/#.','##/.#','.#/##','#./##','###/.#.','.#./###','#./##/#.','.#/##/.#','##./.##','.##/##.'].map(parse);
const SPECIALS = ['bomb', 'bolt', 'ice'];
const mkPiece = (cells, color, special) => ({
  cells, color, special, sIdx: special ? rnd(cells.length) : -1,
  w: Math.max(...cells.map((x) => x[1])) + 1, h: Math.max(...cells.map((x) => x[0])) + 1,
});
const randPiece = () => mkPiece(SHAPES[rnd(SHAPES.length)], rnd(COLORS.length), Math.random() < 0.16 ? SPECIALS[rnd(3)] : undefined);
const rotatePiece = (p) => ({ ...p, cells: p.cells.map(([r, c]) => [c, p.h - 1 - r]), w: p.h, h: p.w });

class Game {
  constructor(best) { this.best = best; this.ls = []; this.onUpdate = () => {}; this.reset(); }
  on(fn) { this.ls.push(fn); return () => { this.ls = this.ls.filter((f) => f !== fn); }; }
  emit(e) { this.ls.forEach((f) => f(e)); }
  reset() {
    this.board = Array.from({ length: N }, () => Array(N).fill(null));
    this.score = 0; this.streak = 0; this.mult = 1; this.fever = 0; this.feverMoves = 0;
    this.charge = { ...COST }; this.armed = null; this.over = false; this.stuck = false;
    this.tray = this.genTray(); this.onUpdate();
  }
  genTray() {
    let t = [];
    for (let k = 0; k < 40; k++) { t = [randPiece(), randPiece(), randPiece()]; if (t.some((p) => this.fits(p))) break; }
    return t;
  }
  canPlace(p, r0, c0) {
    return p.cells.every(([dr, dc]) => { const r = r0 + dr, c = c0 + dc; return r >= 0 && c >= 0 && r < N && c < N && !this.board[r][c]; });
  }
  fits(p) { for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (this.canPlace(p, r, c)) return true; return false; }

  place(idx, r0, c0) {
    const p = this.tray[idx];
    if (!p || this.over || !this.canPlace(p, r0, c0)) return false;
    const own = new Set(), placed = [];
    let bomb = null, bolt = false;
    for (let i = 0; i < p.cells.length; i++) {
      const r = r0 + p.cells[i][0], c = c0 + p.cells[i][1];
      if (i === p.sIdx && p.special === 'bomb') { bomb = [r, c]; continue; }
      if (i === p.sIdx && p.special === 'bolt') { bolt = true; continue; }
      this.board[r][c] = i === p.sIdx && p.special === 'ice' ? { color: p.color, hp: 2 } : { color: p.color };
      own.add(r * N + c); placed.push([r, c]);
    }
    this.emit({ t: 'place', cells: placed });

    const cleared = []; let pts = 0;
    const kill = (r, c) => {
      const x = this.board[r] && this.board[r][c];
      if (!x || own.has(r * N + c)) return;
      const ice = x.hp !== undefined;
      cleared.push({ r, c, color: x.color, ice }); pts += ice ? 30 : 10; this.board[r][c] = null;
    };
    if (bomb) { // 💣 3x3
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) kill(bomb[0] + dr, bomb[1] + dc);
      this.emit({ t: 'bomb', r: bomb[0], c: bomb[1] });
    }
    if (bolt) { // ⚡ случайный ряд/столбец
      const row = Math.random() < 0.5, i = rnd(N);
      for (let k = 0; k < N; k++) { if (row) kill(i, k); else kill(k, i); }
      this.emit({ t: 'bolt', kind: row ? 'row' : 'col', i });
    }
    const rows = [], cols = [];
    for (let i = 0; i < N; i++) {
      if (this.board[i].every(Boolean)) rows.push(i);
      if (this.board.every((row) => row[i])) cols.push(i);
    }
    const set = new Map();
    rows.forEach((r) => { for (let c = 0; c < N; c++) set.set(r * N + c, [r, c]); });
    cols.forEach((c) => { for (let r = 0; r < N; r++) set.set(r * N + c, [r, c]); });
    set.forEach(([r, c]) => {
      const x = this.board[r][c];
      if (x.hp !== undefined && x.hp > 1) { x.hp--; this.emit({ t: 'ice', r, c }); } // ❄ трещина
      else { const ice = x.hp !== undefined; cleared.push({ r, c, color: x.color, ice }); pts += ice ? 30 : 10; this.board[r][c] = null; }
    });
    const L = rows.length + cols.length, did = L > 0 || cleared.length > 0;

    const feverNow = this.feverMoves > 0;
    this.streak = did ? this.streak + 1 : 0;
    this.mult = Math.min(4, Math.max(1, this.streak));
    const base = did ? pts + Math.max(0, L - 1) * 20 : 0;
    const gain = (p.cells.length + base * this.mult) * (feverNow ? 2 : 1);

    if (feverNow) { this.feverMoves--; this.fever = (this.feverMoves / 3) * 100; }
    else {
      this.fever = did ? Math.min(100, this.fever + 22 * Math.max(1, L) + 8) : Math.max(0, this.fever - 8);
      if (this.fever >= 100) { this.feverMoves = 3; this.emit({ t: 'fever' }); }
    }

    if (cleared.length) this.emit({ t: 'clear', cells: cleared, lines: L, mult: this.mult });
    if (did) {
      const n = cleared.length || 1;
      const cr = cleared.length ? cleared.reduce((a, x) => a + x.r, 0) / n : r0 + p.h / 2;
      const cc = cleared.length ? cleared.reduce((a, x) => a + x.c, 0) / n : c0 + p.w / 2;
      this.emit({ t: 'popup', text: '+' + gain, r: cr, c: cc, big: gain >= 100 });
      if (this.mult > 1) this.emit({ t: 'popup', text: 'КОМБО ×' + this.mult, r: Math.max(0.5, cr - 1), c: cc, big: true });
      if (feverNow) this.emit({ t: 'popup', text: 'FEVER ×2', r: Math.min(N - 0.5, cr + 1), c: cc });
    }
    this.score += gain;
    if (this.score > this.best) this.best = this.score;
    Object.keys(COST).forEach((b) => { this.charge[b] = Math.min(COST[b], this.charge[b] + gain); });
    this.tray[idx] = null;
    if (this.tray.every((x) => !x)) this.tray = this.genTray();
    this.armed = null; this.checkOver(); this.onUpdate();
    return true;
  }
  arm(b) {
    if (this.over || this.charge[b] < COST[b]) return;
    if (b === 'refresh') { this.tray = this.genTray(); this.charge.refresh -= COST.refresh; this.armed = null; this.emit({ t: 'refresh' }); }
    else this.armed = this.armed === b ? null : b;
    this.checkOver(); this.onUpdate();
  }
  rotateTray(idx) {
    const p = this.tray[idx];
    if (this.armed !== 'rotate' || !p || this.over) return;
    this.tray[idx] = rotatePiece(p); this.charge.rotate -= COST.rotate; this.armed = null;
    this.emit({ t: 'rotate' }); this.checkOver(); this.onUpdate();
  }
  hammer(r, c) {
    if (this.armed !== 'hammer' || this.over || !(this.board[r] && this.board[r][c])) return false;
    this.board[r][c] = null; this.charge.hammer -= COST.hammer; this.armed = null;
    this.emit({ t: 'hammer', r, c }); this.checkOver(); this.onUpdate(); return true;
  }
  checkOver() {
    const move = this.tray.some((p) => p && this.fits(p));
    const afford = Object.keys(COST).some((b) => this.charge[b] >= COST[b]);
    this.stuck = !move;
    if (!move && !afford && !this.over) { this.over = true; this.emit({ t: 'over' }); }
  }
}

/* ================= Canvas ================= */
function createCanvas(game, wrap, canvas) {
  const ctx = canvas.getContext('2d');
  let W = 300, cell = W / N, trayTop = 0, trayH = 0, dpr = 1;
  const parts = [], floats = [], fades = [], rings = [], beams = [];
  const pop = Array.from({ length: N }, () => Array(N).fill(-9));
  const spawn = [0, 0, 0], seen = [null, null, null];
  let shake = 0, flash = 0, time = 0, drag = null;
  const SPB = { bomb: '#3b2d57', bolt: '#ffcf33' };
  const easeOutBack = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

  const layout = () => {
    const b = wrap.getBoundingClientRect(), K = 1 + 2.5 / N;
    W = Math.floor(Math.max(120, Math.min(b.width, b.height / K)));
    cell = W / N; trayTop = W + cell * 0.3; trayH = cell * 2.2;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = W + 'px'; canvas.style.height = trayTop + trayH + 'px';
    canvas.width = Math.round(W * dpr); canvas.height = Math.round((trayTop + trayH) * dpr);
  };
  const rr = (x, y, w, h, r) => {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  };
  const glyph = (ch, x, y, s) => { ctx.font = (s * 0.55) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(ch, x, y + s * 0.04); };
  const block = (x, y, s, color, a = 1, hp, base, sc = 1) => {
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(x + s / 2, y + s / 2); ctx.scale(sc, sc);
    const g = s - 3, h = g / 2;
    rr(-h, -h, g, g, s * 0.2); ctx.fillStyle = base || (hp !== undefined ? '#bfefff' : COLORS[color]); ctx.fill();
    const gr = ctx.createLinearGradient(0, -h, 0, h);
    gr.addColorStop(0, 'rgba(255,255,255,.38)'); gr.addColorStop(0.5, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(0,0,0,.22)');
    ctx.fillStyle = gr; rr(-h, -h, g, g, s * 0.2); ctx.fill();
    ctx.lineWidth = Math.max(1, s * 0.04); ctx.strokeStyle = 'rgba(255,255,255,.35)'; rr(-h + 1, -h + 1, g - 2, g - 2, s * 0.18); ctx.stroke();
    if (hp === 1) {
      ctx.strokeStyle = 'rgba(30,80,120,.75)'; ctx.lineWidth = s * 0.05; ctx.beginPath();
      ctx.moveTo(-h * 0.6, -h * 0.7); ctx.lineTo(-h * 0.1, -h * 0.1); ctx.lineTo(-h * 0.5, h * 0.3);
      ctx.moveTo(-h * 0.1, -h * 0.1); ctx.lineTo(h * 0.5, h * 0.1); ctx.lineTo(h * 0.3, h * 0.7); ctx.stroke();
    }
    ctx.restore();
  };
  const cellFx = (p, i) => { const sp = i === p.sIdx ? p.special : undefined; return { sp, hp: sp === 'ice' ? 2 : undefined, base: sp === 'bomb' || sp === 'bolt' ? SPB[sp] : undefined }; };
  const drawPiece = (p, tlx, tly, s, a = 1) => {
    p.cells.forEach(([r, c], i) => {
      const x = tlx + c * s, y = tly + r * s, f = cellFx(p, i);
      block(x, y, s, p.color, a, f.hp, f.base);
      if (f.sp) { ctx.save(); ctx.globalAlpha *= a; glyph(f.sp === 'bomb' ? '💣' : f.sp === 'bolt' ? '⚡' : '❄️', x + s / 2, y + s / 2, s); ctx.restore(); }
    });
  };
  const burst = (x, y, color, n, sp) => {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random()), life = 0.5 + Math.random() * 0.5;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * 0.3, life, max: life, color, size: cell * (0.07 + Math.random() * 0.1) });
    }
    if (parts.length > 500) parts.splice(0, parts.length - 500);
  };
  const cx = (v) => v * cell + cell / 2;

  game.on((e) => {
    switch (e.t) {
      case 'place': e.cells.forEach(([r, c]) => { pop[r][c] = time; }); break;
      case 'clear':
        e.cells.forEach(({ r, c, color, ice }) => { fades.push({ r, c, color, ice, t: 0 }); burst(cx(c), cx(r), ice ? '#bfefff' : COLORS[color], 5, cell * 5); });
        shake = Math.max(shake, 3 + e.lines * 2.5); flash = Math.min(0.5, 0.12 * Math.max(1, e.lines)); break;
      case 'bomb':
        rings.push({ x: cx(e.c), y: cx(e.r), t: 0 });
        burst(cx(e.c), cx(e.r), '#ffb020', 36, cell * 9); burst(cx(e.c), cx(e.r), '#ff5d3a', 20, cell * 6);
        shake = 14; flash = 0.4; break;
      case 'bolt':
        beams.push({ kind: e.kind, i: e.i, t: 0 });
        for (let k = 0; k < N; k++) burst(e.kind === 'row' ? cx(k) : cx(e.i), e.kind === 'row' ? cx(e.i) : cx(k), '#ffe36b', 3, cell * 4);
        shake = 8; flash = 0.3; break;
      case 'ice': burst(cx(e.c), cx(e.r), '#bfefff', 12, cell * 4); pop[e.r][e.c] = time; break;
      case 'popup': floats.push({ text: e.text, x: cx(e.c), y: cx(e.r), t: 0, big: !!e.big }); break;
      case 'hammer': burst(cx(e.c), cx(e.r), '#ffffff', 14, cell * 5); shake = 4; break;
      case 'fever': flash = 0.6; break;
    }
  });

  const pos = (e) => { const b = canvas.getBoundingClientRect(), k = W / b.width; return { x: (e.clientX - b.left) * k, y: (e.clientY - b.top) * k }; };
  const target = () => {
    if (!drag) return null; const p = game.tray[drag.idx]; if (!p) return null;
    return { p, col: Math.round((drag.x - (p.w * cell) / 2) / cell), row: Math.round((drag.y - drag.off - (p.h * cell) / 2) / cell) };
  };
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault(); if (game.over) return;
    const { x, y } = pos(e);
    if (game.armed === 'hammer' && y < W) { game.hammer(Math.floor(y / cell), Math.floor(x / cell)); return; }
    if (y < trayTop - cell * 0.3) return;
    const idx = Math.max(0, Math.min(2, Math.floor(x / (W / 3)))), p = game.tray[idx];
    if (!p) return;
    if (game.armed === 'rotate') { game.rotateTray(idx); spawn[idx] = time; return; }
    canvas.setPointerCapture(e.pointerId);
    game.emit({ t: 'pick' });
    // 60px выше пальца на тач-экранах, чтобы палец не закрывал сетку
    drag = { idx, x, y, sx: idx * (W / 3) + W / 6, sy: trayTop + trayH / 2, k: 0, off: e.pointerType === 'mouse' ? 24 : 60 };
  });
  canvas.addEventListener('pointermove', (e) => { if (drag) { const p = pos(e); drag.x = p.x; drag.y = p.y; } });
  const up = (e) => {
    if (!drag) return;
    const ok = e.type === 'pointerup';
    if (ok) { const p = pos(e); drag.x = p.x; drag.y = p.y; }
    const t = ok ? target() : null, idx = drag.idx;
    drag = null;
    if (t && game.canPlace(t.p, t.row, t.col)) game.place(idx, t.row, t.col); else spawn[idx] = time;
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  const update = (dt) => {
    shake *= Math.exp(-dt * 9); if (shake < 0.1) shake = 0;
    flash *= Math.exp(-dt * 6);
    for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.life -= dt; p.vy += cell * 14 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.life <= 0) parts.splice(i, 1); }
    const adv = (arr, d) => { for (let i = arr.length - 1; i >= 0; i--) { arr[i].t += dt / d; if (arr[i].t >= 1) arr.splice(i, 1); } };
    adv(fades, 0.38); adv(rings, 0.5); adv(beams, 0.4); adv(floats, 1.0);
    if (drag) {
      const a = 1 - Math.exp(-dt * 28);
      drag.sx += (drag.x - drag.sx) * a; drag.sy += (drag.y - drag.off - drag.sy) * a;
      drag.k += (1 - drag.k) * (1 - Math.exp(-dt * 20));
    }
  };

  const render = () => {
    const H = trayTop + trayH;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

    ctx.fillStyle = '#1b1832'; rr(0, 0, W, W, cell * 0.3); ctx.fill();
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.fillStyle = (((r / 3) | 0) + ((c / 3) | 0)) % 2 ? '#2a2548' : '#231f3f';
      rr(c * cell + 1.5, r * cell + 1.5, cell - 3, cell - 3, cell * 0.18); ctx.fill();
    }

    // ghost + подсветка линий
    const t = target(), ghost = new Set(), hot = new Set();
    let bombAt = null;
    if (t && game.canPlace(t.p, t.row, t.col)) {
      t.p.cells.forEach(([dr, dc], i) => {
        ghost.add((t.row + dr) * N + t.col + dc);
        if (i === t.p.sIdx && t.p.special === 'bomb') bombAt = [t.row + dr, t.col + dc];
      });
      const filled = (r, c) => !!game.board[r][c] || ghost.has(r * N + c);
      for (let i = 0; i < N; i++) {
        let rf = true, cf = true;
        for (let k = 0; k < N; k++) { if (!filled(i, k)) rf = false; if (!filled(k, i)) cf = false; }
        for (let k = 0; k < N; k++) { if (rf) hot.add(i * N + k); if (cf) hot.add(k * N + i); }
      }
    }
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const x = game.board[r][c]; if (!x) continue;
      const d = time - pop[r][c], sc = d < 0.28 ? 1 + 0.22 * Math.sin((Math.PI * d) / 0.28) : 1;
      block(c * cell, r * cell, cell, x.color, 1, x.hp, undefined, sc);
      if (x.hp === 2) { ctx.save(); glyph('❄️', cx(c), cx(r), cell); ctx.restore(); }
      if (hot.has(r * N + c)) { ctx.fillStyle = 'rgba(255,255,255,' + (0.2 + 0.12 * Math.sin(time * 10)) + ')'; rr(c * cell + 2, r * cell + 2, cell - 4, cell - 4, cell * 0.18); ctx.fill(); }
    }
    if (t && ghost.size) {
      t.p.cells.forEach(([dr, dc], i) => {
        const f = cellFx(t.p, i), x = (t.col + dc) * cell, y = (t.row + dr) * cell;
        block(x, y, cell, t.p.color, 0.5, f.hp, f.base);
        if (hot.has((t.row + dr) * N + t.col + dc)) { ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(x + 2, y + 2, cell - 4, cell - 4, cell * 0.18); ctx.fill(); }
      });
      if (bombAt) { ctx.fillStyle = 'rgba(255,120,40,.28)'; rr((bombAt[1] - 1) * cell, (bombAt[0] - 1) * cell, cell * 3, cell * 3, cell * 0.25); ctx.fill(); }
    }
    if (game.feverMoves > 0) {
      ctx.save(); ctx.shadowColor = '#ff9d2e'; ctx.shadowBlur = 16 + 6 * Math.sin(time * 8);
      ctx.strokeStyle = '#ff9d2e'; ctx.lineWidth = 3; rr(1.5, 1.5, W - 3, W - 3, cell * 0.3); ctx.stroke(); ctx.restore();
    }

    fades.forEach((f) => {
      ctx.save(); ctx.globalAlpha = 1 - f.t;
      block(f.c * cell, f.r * cell, cell, f.color, 1, f.ice ? 1 : undefined, undefined, 1 + 0.25 * f.t);
      ctx.fillStyle = 'rgba(255,255,255,' + 0.7 * (1 - f.t) + ')'; rr(f.c * cell + 2, f.r * cell + 2, cell - 4, cell - 4, cell * 0.18); ctx.fill(); ctx.restore();
    });
    beams.forEach((b) => {
      ctx.save(); ctx.globalAlpha = 1 - b.t; const th = cell * (0.9 - 0.5 * b.t);
      ctx.shadowColor = '#ffe36b'; ctx.shadowBlur = 24; ctx.fillStyle = '#fff6c2';
      if (b.kind === 'row') ctx.fillRect(0, b.i * cell + (cell - th) / 2, W, th); else ctx.fillRect(b.i * cell + (cell - th) / 2, 0, th, W);
      ctx.restore();
    });
    rings.forEach((r) => {
      ctx.save(); ctx.globalAlpha = 1 - r.t; ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = cell * 0.25 * (1 - r.t) + 1;
      ctx.beginPath(); ctx.arc(r.x, r.y, cell * (0.4 + 2.2 * r.t), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    });
    parts.forEach((p) => { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); });
    ctx.globalAlpha = 1;
    if (flash > 0.01) { ctx.fillStyle = 'rgba(255,255,255,' + flash * 0.35 + ')'; rr(0, 0, W, W, cell * 0.3); ctx.fill(); }

    for (let i = 0; i < 3; i++) {
      const x0 = i * (W / 3);
      ctx.fillStyle = 'rgba(255,255,255,.045)'; rr(x0 + 4, trayTop, W / 3 - 8, trayH, cell * 0.3); ctx.fill();
      const p = game.tray[i];
      if (game.armed === 'rotate' && p) {
        ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.4 * Math.sin(time * 8)) + ')'; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
        rr(x0 + 4, trayTop, W / 3 - 8, trayH, cell * 0.3); ctx.stroke(); ctx.restore();
      }
      if (seen[i] !== p) { seen[i] = p; spawn[i] = time; }
      if (!p || (drag && drag.idx === i)) continue;
      const s = cell * 0.36 * easeOutBack(Math.min(1, Math.max(0, (time - spawn[i]) / 0.35)));
      drawPiece(p, x0 + W / 6 - (p.w * s) / 2, trayTop + trayH / 2 - (p.h * s) / 2, s, game.fits(p) ? 1 : 0.35);
    }
    if (drag) {
      const p = game.tray[drag.idx];
      if (p) {
        const s = cell * (0.36 + 0.64 * drag.k);
        ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8;
        drawPiece(p, drag.sx - (p.w * s) / 2, drag.sy - (p.h * s) / 2, s); ctx.restore();
      }
    }
    floats.forEach((f) => {
      const a = f.t < 0.7 ? 1 : 1 - (f.t - 0.7) / 0.3;
      const sc = f.t < 0.15 ? 0.6 + (f.t / 0.15) * 0.6 : 1.2 - Math.min(0.2, (f.t - 0.15) * 0.3);
      const size = cell * (f.big ? 0.62 : 0.46) * sc;
      ctx.save(); ctx.globalAlpha = a; ctx.font = '700 ' + size + 'px Fredoka, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
      const x = Math.max(size * 2, Math.min(W - size * 2, f.x)), y = f.y - f.t * cell * 1.3;
      ctx.lineWidth = size * 0.25; ctx.strokeStyle = 'rgba(20,10,40,.85)'; ctx.strokeText(f.text, x, y);
      ctx.fillStyle = f.big ? '#ffd23f' : '#fff'; ctx.fillText(f.text, x, y); ctx.restore();
    });
  };

  let last = performance.now();
  const frame = (now) => { const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt; update(dt); render(); requestAnimationFrame(frame); };
  layout(); new ResizeObserver(layout).observe(wrap); requestAnimationFrame(frame);
}

/* ================= Интерфейс ================= */
const $ = (id) => document.getElementById(id);
const game = new Game(localBest());
let savedBest = game.best, lastScore = 0;

const name = userName();
$('uname').textContent = name;
$('avatar').textContent = name.slice(0, 1).toUpperCase();

const boosters = [...document.querySelectorAll('.booster')];
boosters.forEach((el) => el.addEventListener('click', () => game.arm(el.dataset.b)));
$('again').addEventListener('click', () => game.reset());
$('mute').textContent = muted ? '🔇' : '🔊';
$('mute').addEventListener('click', () => {
  muted = !muted; tgTry(() => localStorage.setItem('bb_mute', muted ? '1' : '0'));
  $('mute').textContent = muted ? '🔇' : '🔊';
});
document.addEventListener('pointerdown', () => ac(), { passive: true });
document.addEventListener('contextmenu', (e) => e.preventDefault());

game.onUpdate = () => {
  $('score').textContent = game.score; $('best').textContent = game.best;
  if (game.score !== lastScore) { lastScore = game.score; const b = $('score'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump'); }
  const on = game.feverMoves > 0;
  $('meter').classList.toggle('on', on);
  $('fill').style.width = game.fever + '%';
  $('meterTxt').textContent = on ? '🔥 FEVER ×2 · ходов: ' + game.feverMoves : game.mult > 1 ? 'Комбо ×' + game.mult : 'Сжигай линии подряд';
  boosters.forEach((el) => {
    const b = el.dataset.b, ready = game.charge[b] >= COST[b];
    el.classList.toggle('ready', ready); el.classList.toggle('armed', game.armed === b);
    el.disabled = !ready && game.armed !== b;
    el.querySelector('i').style.width = (game.charge[b] / COST[b]) * 100 + '%';
  });
  $('hint').textContent = game.armed === 'rotate' ? 'Тапни по фигуре, чтобы повернуть'
    : game.armed === 'hammer' ? 'Тапни по клетке, чтобы убрать её'
    : game.stuck && !game.over ? 'Нет ходов — используй бустер!' : '';
  $('over').classList.toggle('show', game.over);
  $('oScore').textContent = game.score; $('oBest').textContent = 'Рекорд: ' + game.best;
  if (game.best > savedBest) { savedBest = game.best; saveLocal(game.best); }
};

game.on((e) => {
  switch (e.t) {
    case 'pick': sfx.pick(); haptic.light(); break;
    case 'place': sfx.place(); haptic.light(); break;
    case 'clear': sfx.clear(e.lines + e.mult); haptic.heavy(); break;
    case 'bomb': sfx.bomb(); haptic.heavy(); break;
    case 'bolt': sfx.bolt(); haptic.heavy(); break;
    case 'ice': sfx.ice(); break;
    case 'hammer': sfx.hammer(); haptic.light(); break;
    case 'rotate': case 'refresh': sfx.boost(); break;
    case 'fever': sfx.fever(); break;
    case 'over': sfx.over(); haptic.error(); saveBest(game.best); break;
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveBest(game.best); });

createCanvas(game, $('wrap'), $('cv'));
game.onUpdate();
loadBest().then((b) => { if (b > game.best) { game.best = b; savedBest = b; game.onUpdate(); } });
</script>
